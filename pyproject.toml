[project]
name = "rag-lgpd-brazil"
version = "0.1.0"
description = "Rag para consulta de perguntas sobre a LGPD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "langchain-text-splitters>=0.2",
    "tiktoken>=0.7",
    "rank-bm25>=0.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "pandas>=2.0",
    "numpy>=1.26",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "nbval>=0.11",
]
eval = [
    "ragas>=0.2,<0.3",
    "langchain-openai>=0.1",
    "langchain-huggingface>=0.1",
]
huggingface = [
    "sentence-transformers>=3.0",  # embedding local (SentenceTransformerEmbeddingFunction)
    "transformers>=4.40",          # tokenizador HF para chunking
    "torch>=2.0",                  # backend do sentence-transformers
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Placeholders intencionais para o aluno preencher (TODOs do projeto)
"src/pipeline/*.py" = ["F821", "F841"]
# sys.path.insert + load_dotenv() precisam vir antes dos imports do projeto
"src/ui/streamlit_app.py" = ["E402"]
